<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DohaTV</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="header">DohaTV - شاشة البث الذكية</div>
        
        <!-- الشاشة الموحدة التي تتغير محتوياتها -->
        <div class="slides-container" id="tv-view">
            جاري تحميل القنوات والأقسام...
        </div>

        <!-- شريط الأخبار المكتوبة حصرياً من الجزيرة -->
        <div class="news-ticker">
            <span id="aljazeera-news-text">جاري جلب آخر الأخبار المكتوبة من قناة الجزيرة...</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
