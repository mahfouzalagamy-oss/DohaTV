name: Publish DohaTV web app

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'favicon.svg'
      - 'sw.js'
      - 'doha-skyline.svg'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare web app
        run: |
          mkdir -p web-dist
          cp index.html styles.css app.js manifest.webmanifest favicon.svg sw.js doha-skyline.svg web-dist/
      - name: Package web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist
      - name: Publish web app
        id: deployment
        uses: actions/deploy-pages@v4
