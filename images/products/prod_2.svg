<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="grad_prod_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="600" rx="24" fill="#0d1b2a"/>
  <!-- Decorative Background Ring -->
  <circle cx="260" cy="300" r="180" fill="#f59e0b" opacity="0.12"/>

  <!-- Product Bottle / Box Illustration -->
  <g filter="url(#shadow)">
    <!-- Bottle Body -->
    <rect x="180" y="160" width="160" height="280" rx="28" fill="url(#grad_prod_2)"/>
    <!-- Bottle Cap -->
    <rect x="220" y="120" width="80" height="40" rx="8" fill="#e2e8f0"/>
    <!-- Label -->
    <rect x="195" y="230" width="130" height="150" rx="12" fill="#ffffff"/>
    <rect x="205" y="245" width="110" height="18" rx="4" fill="#f59e0b"/>
    <text x="260" y="295" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">PERFECT</text>
    <text x="260" y="315" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">WEIGHT</text>
    <circle cx="260" cy="345" r="12" fill="#fbbf24"/>
  </g>

  <!-- Tag Badge -->
  <rect x="420" y="140" width="180" height="36" rx="18" fill="#fbbf24" fill-opacity="0.2"/>
  <rect x="420" y="140" width="180" height="36" rx="18" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="510" y="164" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fbbf24" text-anchor="middle">طبيعي 100% 🌿</text>

  <!-- Title & Description in Arabic -->
  <text x="420" y="230" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="start">NaturaDiet Slim Gold</text>
  <text x="420" y="275" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#cbd5e1" text-anchor="start">ناتشورادايت سليم للتخسيس الفعال</text>
  <text x="420" y="330" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="start">مستخلصات أعشاب طبيعية لرفع معدل الأيض اليومي</text>

  <!-- Contact / Order Info -->
  <rect x="420" y="390" width="300" height="50" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <text x="570" y="422" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#34d399" text-anchor="middle">📞 للطلب والاستفسار: 71002141</text>
</svg>